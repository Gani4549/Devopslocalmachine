trigger:
- master

pool:
  name: Default

stages:

# =====================================================
# BUILD STAGE
# =====================================================

- stage: Build
  displayName: Build Stage

  jobs:

  - job: MavenBuild
    displayName: Maven Build Job

    steps:

    # ==========================================
    # CHECKOUT
    # ==========================================

    - checkout: self

    # ==========================================
    # DISPLAY CURRENT DIRECTORY
    # ==========================================

    - script: |
        echo Current Directory:
        cd

        echo ==========================
        echo Files in Source Directory
        echo ==========================

        dir

      displayName: Show Source Files

    # ==========================================
    # CHECK JAVA & MAVEN
    # ==========================================

    - script: |
        java --version
        mvn --version
      displayName: Check Java and Maven

    # ==========================================
    # MAVEN BUILD
    # ==========================================

    - script: |
        mvn clean install
      displayName: Maven Build

    # ==========================================
    # FIND GENERATED FILES
    # ==========================================

    - script: |
        echo ==========================
        echo Searching for JAR Files
        echo ==========================

        dir /s *.jar

      displayName: Find JAR Files


# =====================================================
# DEPLOY STAGE
# =====================================================

- stage: Deploy
  displayName: Deploy Stage

  dependsOn: Build

  jobs:

  - job: DeployJob
    displayName: Deploy To Local Machine

    steps:

    # ==========================================
    # CREATE DEPLOYMENT DIRECTORY
    # ==========================================

    - script: |
        if not exist C:\JavaDeployment mkdir C:\JavaDeployment
      displayName: Create Deployment Folder

    # ==========================================
    # COPY GENERATED JAR
    # ==========================================

    - script: |
        for /r %%i in (*.jar) do copy "%%i" C:\JavaDeployment
      displayName: Copy JAR File

    # ==========================================
    # VERIFY DEPLOYMENT
    # ==========================================

    - script: |
        echo ==========================
        echo Deployment Files
        echo ==========================

        dir C:\JavaDeployment
      displayName: Verify Deployment