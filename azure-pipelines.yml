trigger:
- master

pool:
  name: Default

stages:

# =====================================================
# BUILD STAGE
# =====================================================

- stage: Build
  displayName: Build Stage

  jobs:

  - job: MavenBuild
    displayName: Maven Build Job

    steps:

    # ==========================================
    # CHECKOUT CODE
    # ==========================================

    - checkout: self

    # ==========================================
    # SHOW PROJECT FILES
    # ==========================================

    - script: |
        echo ==================================
        echo CURRENT DIRECTORY
        echo ==================================

        cd

        echo ==================================
        echo PROJECT FILES
        echo ==================================

        dir

      displayName: Show Project Files

    # ==========================================
    # CHECK JAVA & MAVEN
    # ==========================================

    - script: |
        java --version
        mvn --version
      displayName: Check Java and Maven

    # ==========================================
    # MAVEN BUILD
    # ==========================================

    - script: |
        mvn clean package
      displayName: Maven Package

    # ==========================================
    # FIND GENERATED ARTIFACTS
    # ==========================================

    - script: |
        echo ==================================
        echo SEARCHING FOR WAR FILES
        echo ==================================

        dir /s *.war

        echo ==================================
        echo SEARCHING FOR JAR FILES
        echo ==================================

        dir /s *.jar

      displayName: Find Generated Artifacts


# =====================================================
# DEPLOY STAGE
# =====================================================

- stage: Deploy
  displayName: Deploy Stage

  dependsOn: Build

  jobs:

  - job: DeployToLocal
    displayName: Deploy To Local Machine

    steps:

    # ==========================================
    # CREATE DEPLOYMENT DIRECTORY
    # ==========================================

    - script: |
        if not exist C:\JavaDeployment mkdir C:\JavaDeployment
      displayName: Create Deployment Folder

    # ==========================================
    # COPY WAR FILES
    # ==========================================

    - script: |
        for /r %%i in (*.war) do copy "%%i" C:\JavaDeployment
      displayName: Copy WAR Files

    # ==========================================
    # COPY JAR FILES
    # ==========================================

    - script: |
        for /r %%i in (*.jar) do copy "%%i" C:\JavaDeployment
      displayName: Copy JAR Files

    # ==========================================
    # VERIFY DEPLOYMENT
    # ==========================================

    - script: |
        echo ==================================
        echo DEPLOYED FILES
        echo ==================================

        dir C:\JavaDeployment

      displayName: Verify Deployment