trigger:
- master

pool:
  name: Default

stages:

# =====================================================
# BUILD STAGE
# =====================================================

- stage: Build
  displayName: Build WAR Project

  jobs:

  - job: BuildWebApp
    displayName: Build WebApp WAR

    steps:

    # ==========================================
    # CHECKOUT SOURCE CODE
    # ==========================================

    - checkout: self

    # ==========================================
    # DISPLAY PROJECT FILES
    # ==========================================

    - script: |
        echo =====================================
        echo ROOT PROJECT FILES
        echo =====================================

        dir

        echo =====================================
        echo WEBAPP FILES
        echo =====================================

        dir webapp

      displayName: Show Project Structure

    # ==========================================
    # CHECK JAVA & MAVEN
    # ==========================================

    - script: |
        java --version
        mvn --version

      displayName: Check Java and Maven

    # ==========================================
    # BUILD WEBAPP MODULE
    # ==========================================

    - script: |
        mvn clean package -pl webapp -am

      displayName: Build WAR File

    # ==========================================
    # SHOW TARGET FOLDER
    # ==========================================

    - script: |
        echo =====================================
        echo WEBAPP TARGET CONTENT
        echo =====================================

        dir webapp\target

      displayName: Show Target Folder

    # ==========================================
    # SEARCH GENERATED WAR
    # ==========================================

    - script: |
        echo =====================================
        echo SEARCHING FOR WAR FILE
        echo =====================================

        dir /s *.war

      displayName: Find WAR File


# =====================================================
# DEPLOY STAGE
# =====================================================

- stage: Deploy
  displayName: Deploy WAR File

  dependsOn: Build

  jobs:

  - job: DeployToLocal
    displayName: Deploy To Local Machine

    steps:

    # ==========================================
    # CREATE DEPLOYMENT DIRECTORY
    # ==========================================

    - script: |
        if not exist C:\JavaDeployment mkdir C:\JavaDeployment

      displayName: Create Deployment Folder

    # ==========================================
    # COPY WAR FILE
    # ==========================================

    - script: |
        copy webapp\target\*.war C:\JavaDeployment

      displayName: Copy WAR File

    # ==========================================
    # VERIFY DEPLOYMENT
    # ==========================================

    - script: |
        echo =====================================
        echo DEPLOYED FILES
        echo =====================================

        dir C:\JavaDeployment

      displayName: Verify Deployment