trigger:
- master

pool:
  name: Default

stages:

# =====================================================
# BUILD STAGE
# =====================================================

- stage: Build
  displayName: Build WAR Project

  jobs:

  - job: BuildWebApp
    displayName: Build WebApp WAR

    steps:

    # ==========================================
    # CHECKOUT SOURCE CODE
    # ==========================================

    - checkout: self

    # ==========================================
    # CONFIGURE JAVA 11
    # ==========================================

    - script: |
        set JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-11.0.31.11-hotspot

        set PATH=%JAVA_HOME%\bin;%PATH%

        echo =====================================
        echo JAVA VERSION
        echo =====================================

        java -version

        echo =====================================
        echo MAVEN VERSION
        echo =====================================

        mvn -version

      displayName: Configure Java 11

    # ==========================================
    # SHOW S FOLDER CONTENTS
    # ==========================================

    - script: |
        echo =====================================
        echo CONTENTS OF S FOLDER
        echo =====================================

        dir "C:\agent\_work\1\s"

        echo =====================================
        echo WEBAPP FOLDER
        echo =====================================

        dir "C:\agent\_work\1\s\webapp"

      displayName: Show S Folder Contents

    # ==========================================
    # BUILD WAR FILE
    # ==========================================

    - script: |
        set JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-11.0.31.11-hotspot

        set PATH=%JAVA_HOME%\bin;%PATH%

        mvn clean package -pl webapp -am

      displayName: Build WAR File

    # ==========================================
    # VERIFY GENERATED WAR FILE
    # ==========================================

    - script: |
        echo =====================================
        echo GENERATED WAR FILE
        echo =====================================

        dir "C:\agent\_work\1\s\webapp\target"

      displayName: Verify WAR File

    # ==========================================
    # PUBLISH BUILD ARTIFACT
    # ==========================================

    - task: PublishBuildArtifacts@1
      displayName: Publish WAR Artifact
      inputs:
        PathtoPublish: 'webapp\target'
        ArtifactName: 'warfile'
        publishLocation: 'Container'


# =====================================================
# DEPLOY STAGE
# =====================================================

- stage: Deploy
  displayName: Deploy WAR To Tomcat

  dependsOn: Build

  jobs:

  - job: DeployToTomcat
    displayName: Deploy WAR To Local Tomcat

    steps:

    # ==========================================
    # DOWNLOAD BUILD ARTIFACT
    # ==========================================

    - task: DownloadBuildArtifacts@1
      displayName: Download WAR Artifact
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'warfile'
        downloadPath: '$(System.ArtifactsDirectory)'

    # ==========================================
    # VERIFY DOWNLOADED ARTIFACTS
    # ==========================================

    - script: |
        echo =====================================
        echo DOWNLOADED ARTIFACTS
        echo =====================================

        dir /s "$(System.ArtifactsDirectory)"

      displayName: Verify Downloaded WAR

    # ==========================================
    # COPY WAR TO TOMCAT
    # ==========================================

    - script: |
        echo =====================================
        echo COPYING WAR TO TOMCAT
        echo =====================================

        copy "$(System.ArtifactsDirectory)\warfile\webapp.war" "C:\Users\ABKO472\Downloads\apache-tomcat-11.0.21-windows-x64\apache-tomcat-11.0.21\webapps"

      displayName: Copy WAR To Tomcat

    # ==========================================
    # RESTART TOMCAT
    # ==========================================

    - script: |
        echo =====================================
        echo RESTARTING TOMCAT
        echo =====================================

        call "C:\Users\ABKO472\Downloads\apache-tomcat-11.0.21-windows-x64\apache-tomcat-11.0.21\bin\shutdown.bat"

        timeout /t 10

        call "C:\Users\ABKO472\Downloads\apache-tomcat-11.0.21-windows-x64\apache-tomcat-11.0.21\bin\startup.bat"

      displayName: Restart Tomcat

    # ==========================================
    # VERIFY TOMCAT DEPLOYMENT
    # ==========================================

    - script: |
        echo =====================================
        echo FILES INSIDE TOMCAT WEBAPPS
        echo =====================================

        dir "C:\Users\ABKO472\Downloads\apache-tomcat-11.0.21-windows-x64\apache-tomcat-11.0.21\webapps"

      displayName: Verify WAR Deployment